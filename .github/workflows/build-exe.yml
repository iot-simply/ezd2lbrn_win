name: ezd2lbrn.exe bauen

# Baut die eigenstaendige Windows-Programmdatei auf einem Windows-Runner.
# - Manuell startbar (Actions -> "ezd2lbrn.exe bauen" -> "Run workflow").
#   Wird dabei ein Release-Tag angegeben, wird die exe an dieses Release gehaengt.
# - Laeuft automatisch bei einem Tag wie v1.7 oder 1.7 und haengt die exe an das Release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release-Tag fuer die exe (z. B. 1.7). Leer lassen = nur Artefakt."
        required: false
        default: ""
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Programmsymbol exportieren
        run: python ezd2lbrn.py --icon-export ezd2lbrn_icon.png

      - name: Mit PyInstaller bauen
        run: >
          python -m PyInstaller --onefile --noconsole --name ezd2lbrn
          --icon ezd2lbrn_icon.png
          --collect-submodules fontTools
          --hidden-import PIL.ImageDraw --hidden-import PIL.ImageTk
          ezd2lbrn.py

      # Das Programm ist ein GUI-Programm (--noconsole). PowerShell wartet darauf
      # nicht von selbst, deshalb Start-Process mit -Wait.
      - name: Kurztest (Programm startet und schreibt Symbol)
        run: |
          $exe = Resolve-Path "dist\ezd2lbrn.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--icon-export","test_icon.png" `
                             -WorkingDirectory $PWD -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ezd2lbrn.exe endete mit Code $($p.ExitCode)" }
          if (-not (Test-Path test_icon.png)) { throw "Programm hat kein Symbol geschrieben" }
          Write-Host "ezd2lbrn.exe laeuft, Symbol geschrieben."
          Remove-Item test_icon.png

      - name: Ergebnis als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ezd2lbrn-exe
          path: dist/ezd2lbrn.exe
          if-no-files-found: error

      - name: An Release anhaengen
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "ezd2lbrn $tag" --notes "Eigenstaendige Windows-Programmdatei, gebaut mit PyInstaller."
          }
          gh release upload $tag dist/ezd2lbrn.exe --clobber
          Write-Host "exe an Release $tag gehaengt."
