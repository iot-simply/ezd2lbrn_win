name: ezd2lbrn.exe bauen

# Baut die eigenstaendige Windows-Programmdatei auf einem Windows-Runner.
# - Manuell startbar (Actions -> "ezd2lbrn.exe bauen" -> "Run workflow").
#   Wird dabei ein Release-Tag angegeben, wird die exe an dieses Release gehaengt.
# - Laeuft automatisch bei einem Tag wie v1.7 oder 1.7 und haengt die exe an das Release.
#
# Der Release-Text wird aus CHANGELOG.md erzeugt: der Abschnitt "## <Version>"
# ist die Quelle, damit Changelog und Release nicht auseinanderlaufen.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release-Tag fuer die exe (z. B. 1.7). Leer lassen = nur Artefakt."
        required: false
        default: ""
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Programmsymbol exportieren
        run: python ezd2lbrn.py --icon-export ezd2lbrn_icon.png

      - name: Mit PyInstaller bauen
        run: >
          python -m PyInstaller --onefile --noconsole --name ezd2lbrn
          --icon ezd2lbrn_icon.png
          --collect-submodules fontTools
          --hidden-import PIL.ImageDraw --hidden-import PIL.ImageTk
          ezd2lbrn.py

      # Das Programm ist ein GUI-Programm (--noconsole). PowerShell wartet darauf
      # nicht von selbst, deshalb Start-Process mit -Wait.
      - name: Kurztest (Programm startet und schreibt Symbol)
        run: |
          $exe = Resolve-Path "dist\ezd2lbrn.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--icon-export","test_icon.png" `
                             -WorkingDirectory $PWD -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ezd2lbrn.exe endete mit Code $($p.ExitCode)" }
          if (-not (Test-Path test_icon.png)) { throw "Programm hat kein Symbol geschrieben" }
          Write-Host "ezd2lbrn.exe laeuft, Symbol geschrieben."
          Remove-Item test_icon.png

      - name: Ergebnis als Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: ezd2lbrn-exe
          path: dist/ezd2lbrn.exe
          if-no-files-found: error

      - name: An Release anhaengen
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''

          # Passenden Abschnitt aus CHANGELOG.md holen ("## 1.7" bis zur naechsten "## "-Zeile)
          $abschnitt = @()
          $drin = $false
          foreach ($zeile in (Get-Content CHANGELOG.md -Encoding UTF8)) {
            if ($zeile -match '^##\s+(.*)$') {
              if ($drin) { break }
              if ($Matches[1].Trim() -eq $version) { $drin = $true }
              continue
            }
            if ($drin) { $abschnitt += $zeile }
          }
          $text = ($abschnitt -join "`n").Trim()

          $notizen = @()
          if ($text) {
            $notizen += "## Aenderungen in $version"
            $notizen += ""
            $notizen += $text
            $notizen += ""
          }
          $notizen += "## Download"
          $notizen += ""
          $notizen += "``ezd2lbrn.exe`` laeuft eigenstaendig, ohne installiertes Python."
          $notizen += "Gebaut mit PyInstaller aus ``$($env:GITHUB_SHA.Substring(0,7))`` auf einem Windows-Runner."
          $notizen += ""
          $notizen += "Die Datei ist nicht signiert. Windows meldet deshalb beim ersten Start SmartScreen:"
          $notizen += "ueber ``Weitere Informationen`` und ``Trotzdem ausfuehren`` bestaetigen."
          $notizen += ""
          $notizen += "Vollstaendige Anleitung: siehe README. Laserparameter vor dem ersten Lauf an Testmaterial pruefen."
          Set-Content -Path release-notes.md -Value ($notizen -join "`n") -Encoding UTF8

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "ezd2lbrn $version" --notes-file release-notes.md
            Write-Host "Release $tag angelegt."
          } else {
            gh release edit $tag --title "ezd2lbrn $version" --notes-file release-notes.md
            Write-Host "Release $tag aktualisiert."
          }
          gh release upload $tag dist/ezd2lbrn.exe --clobber
          Remove-Item release-notes.md
          Write-Host "exe an Release $tag gehaengt."
